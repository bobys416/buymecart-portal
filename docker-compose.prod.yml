services:
  postgres:
    image: postgres:16-alpine
    container_name: buymecart-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-buymecart}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-buymecart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buymecart-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buymecart-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-buymecart}
      STORAGE_DIR: /app/storage
      SECRET_KEY: ${SECRET_KEY:-buymecart-fintech-prod-secret-key-64chars-min-change-in-prod}
      CORS_ORIGINS: '["https://portal.buymecart.org","https://api.buymecart.org"]'
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 1800
      DB_POOL_TIMEOUT: 30
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - buymecart-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buymecart-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: https://api.buymecart.org/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - buymecart-net

volumes:
  postgres-data:
    name: buymecart-postgres-data
  backend-storage:
    name: buymecart-backend-storage

networks:
  buymecart-net:
    name: buymecart-net
    driver: bridge
