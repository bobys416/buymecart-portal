services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buymecart-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: sqlite:////app/data/buymecart_dev.db
      STORAGE_DIR: /app/storage
      SECRET_KEY: buymecart-fintech-secure-signing-key-dev-32chars-min
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001","exp://localhost:8081"]'
    volumes:
      - backend-data:/app/data
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - buymecart-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buymecart-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - buymecart-net

volumes:
  backend-data:
    name: buymecart-backend-data
  backend-storage:
    name: buymecart-backend-storage

networks:
  buymecart-net:
    name: buymecart-net
    driver: bridge
